executors:
  # Swap default to `codex` when Claude Max hits its 5h session limit —
  # NOTE 2026-07-02: codex CLI rejects all models on the current ChatGPT
  # plan ("not supported with a ChatGPT account"); re-run `codex login`
  # or upgrade the plan before relying on it as the fallback executor.
  default: claude-code

goals:
  dir: OS/Goals
  maxIterations: 3
  stepTimeoutMinutes: 30
  judge: single # 'panel' = 3 review lenses must unanimously approve (~3x cost)

# One-click actions — buttons in the Actions tab; add `schedule:` (cron) to
# make one a routine. loop: true injects past run logs so runs self-improve.
actions:
  - name: skill-audit
    label: Audit sessions → propose skills
    project: halo
    loop: true
    schedule: "0 3 * * *" # "dreaming": mine sessions for new skills at 03:00 nightly
    prompt: >
      Open the claude-mem database at ~/.claude-mem/claude-mem.db READ-ONLY
      (sqlite3). Analyse the most recent 150 rows of session_summaries
      (request, completed, next_steps) for recurring manual tasks that are NOT
      yet skills or automations. Produce a markdown report: a table of
      task | frequency | proposed skill name | what it would do, ranked by
      frequency. Write it to "~/Documents/Openclaw yodabot/OS/Reports/" as
      skill-audit-<today>.md (create the folder if needed) and summarise the
      top 5 proposals in your reply.
  - name: vault-index
    label: Rebuild vault index maps
    project: vault
    loop: false
    prompt: >
      You are in the Obsidian vault. Maintain navigation maps for the OS/
      folder tree only (do NOT touch other folders): for OS/ and each of its
      direct subfolders (Memory, Goals, Runs, Reports), write or update an
      INDEX.md that briefly describes what lives there, lists key subfolders
      with one-line descriptions, and links notable recent files. Keep each
      INDEX.md under 60 lines. Report what changed.
  - name: vault-cleanup
    label: Vault cleanup (draft → approve)
    project: vault
    loop: true
    approval: true # draft first; nothing moves until approved on the Board
    prompt: >
      Review the OS/ folder tree of this Obsidian vault (Memory, Goals, Runs,
      Reports). Propose a cleanup plan as a numbered list: files to merge,
      rename, or re-file for clarity. NEVER propose deleting anything —
      consolidate only. Each item: exact source path → exact action → exact
      destination. Keep it under 15 items, highest value first.
    applyPrompt: >
      Execute the approved cleanup plan below exactly. Only perform the listed
      merge/rename/re-file operations — do not delete files, do not touch
      anything not in the plan. Report each operation as done/skipped with reason.
  - name: morning-brief
    label: Morning brief
    project: halo
    loop: true
    # schedule: "0 8 * * *"   # uncomment to run every morning at 08:00
    prompt: >
      Prepare a concise morning brief for Shumon. Read
      "~/Documents/Openclaw yodabot/OS/Runs/" recent run logs and the STATE.md
      of ~/.openclaw/workspace/yodaclaude/halo plus
      ~/.openclaw/workspace/yodaclaude/AIProjects and
      ~/.openclaw/workspace/yodaclaude/trading-bot. Summarise: what changed
      recently, what is pending, and the top 3 suggested focus items for
      today. Write it to "~/Documents/Openclaw yodabot/OS/Reports/" as
      morning-brief-<today>.md and give the brief in your reply.

voice:
  engine: local # Kokoro ONNX in a HALO-managed worker; unloads after idle
  ttsVoice: af_sky
  ttsSpeed: 1.1
  ttsDtype: q8 # ~92MB model; fp32 (~326MB) for maximum quality
  idleUnloadMinutes: 10

# Monthly token allowances. Absent = unmetered (flat subscription / local).
# Auto-routing skips exhausted providers; explicit override still works.
budgets:
  synthetic: { monthlyTokens: 60000000 } # adjust to your actual Synthetic quota
  # openai: { monthlyTokens: 5000000 }
  # openrouter: { monthlyTokens: 2000000 }

routing:
  # Claude Code (Max sub, subscription tier) is PRIMARY; Synthetic (quota) is
  # the secondary fallback; local (free) for cheap summaries; premium API last.
  classOrder:
    chat: [subscription, quota, free, premium]
    summarise: [free, subscription, quota] # cheap local first for bulk summaries
    code: [subscription, quota, premium]
    reason: [subscription, quota, premium]
    vision: [quota, premium] # bridge chat is text-only; vision needs an API model
