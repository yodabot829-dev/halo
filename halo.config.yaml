# HALO configuration — NO SECRETS IN THIS FILE.
# API keys are injected as env vars via `infisical run -- npm run dev`.

server:
  port: 4720
  bind: 127.0.0.1 # switch to Tailscale IP at daemon install (slice 7)

dataDir: ~/.halo/data

vault:
  path: ~/Documents/Openclaw yodabot
  memoryDir: OS/Memory
  indexDirs: # extra vault folders indexed read-only
    - Claude Memory
    - projects
    - wiki
    - output
    - inbox

memory:
  embedModel: nomic-embed-text
  injectTopK: 6
  snippetChars: 1500
  personaPath: ~/.cortana/cortana-persona.md

providers:
  anthropic:
    kind: anthropic
    apiKeyEnv: ANTHROPIC_API_KEY
  openai:
    kind: openai
    apiKeyEnv: OPENAI_API_KEY
  synthetic:
    kind: anthropic # Synthetic exposes an Anthropic-compatible API
    baseURL: https://api.synthetic.new/anthropic/v1
    apiKeyEnv: SYNTHETIC_API_KEY
  openrouter:
    kind: openrouter
    apiKeyEnv: OPENROUTER_API_KEY
  google:
    kind: google
    apiKeyEnv: GEMINI_API_KEY
  ollama:
    kind: ollama
    baseURL: http://127.0.0.1:11434/api
    numCtx: 8192 # 131k default KV cache stalls this 16GB machine
  claude-code:
    kind: claude-code # chat bridge to the Claude Max subscription (flat cost)
    command: claude
    timeoutMs: 150000

models:
  # PRIMARY: chat runs on the Claude Max subscription via the CLI bridge
  # (flat cost). Synthetic (quota tier) is the automatic secondary/fallback.
  - ref: claude-code/claude
    label: Claude (Max via Code)
    classes: [chat, code, reason]
    tier: subscription
  - ref: anthropic/claude-sonnet-5
    label: Claude Sonnet 5
    classes: [chat, code, reason, vision]
    tier: premium
  - ref: openai/gpt-5.1
    label: GPT-5.1
    classes: [chat, code, reason, vision]
    tier: premium
  # GLM-5.2: 744B MoE. Synthetic serves it at 512K context, text-only
  # ($1.40/$4.40 per M). The full 1M window is z.ai-direct only, not Synthetic.
  # Top quota-tier workhorse — reason/code preference below routes here.
  - ref: synthetic/hf:zai-org/GLM-5.2
    label: GLM-5.2 512K (Synthetic)
    classes: [chat, code, reason]
    tier: quota
  - ref: synthetic/hf:zai-org/GLM-5
    label: GLM-5 (Synthetic)
    classes: [chat, code, reason, vision]
    tier: quota
  - ref: synthetic/hf:moonshotai/Kimi-K2.5
    label: Kimi K2.5 (Synthetic)
    classes: [chat, reason, vision]
    tier: quota
  - ref: synthetic/hf:MiniMaxAI/MiniMax-M2.5
    label: MiniMax M2.5 (Synthetic)
    classes: [chat, summarise]
    tier: quota
  - ref: synthetic/hf:Qwen/Qwen3-Coder-480B-A35B-Instruct
    label: Qwen3 Coder (Synthetic)
    classes: [code]
    tier: quota
  # 4b first: the 12b (9.3GB loaded) evicts the voice services under memory
  # pressure on this 16GB machine; 12b stays available via manual override.
  - ref: ollama/gemma3:4b
    label: Gemma 3 4B (local)
    classes: [chat, summarise]
    tier: free
  - ref: ollama/gemma3:12b
    label: Gemma 3 12B (local, heavy)
    classes: [chat, summarise]
    tier: free

# Registered projects — goal executors are confined to these directories.
projects:
  halo: ~/.openclaw/workspace/yodaclaude/halo
  propertyinvestiq: ~/.openclaw/workspace/yodaclaude/AIProjects
  trading-bot: ~/.openclaw/workspace/yodaclaude/trading-bot
  cortana: ~/.openclaw/workspace/yodaclaude/cortana
  journeyforce-website: ~/.openclaw/workspace/yodaclaude/journeyforce-website
  journeyforce-dashboard: ~/.openclaw/workspace/yodaclaude/journeyforce-dashboard
  leadgen-agent: ~/.openclaw/workspace/yodaclaude/leadgen-agent
  faceless-youtube: ~/.openclaw/workspace/yodaclaude/faceless-youtube
  salesforce-accelerators: ~/.openclaw/workspace/yodaclaude/salesforce-accelerators
  gemmawatch: ~/.openclaw/workspace/yodaclaude/gemmawatch
  etsy-store: ~/.openclaw/workspace/yodaclaude/journeyforce # JFStudioTemplates Etsy pipeline
  gardeners-mate: ~/.openclaw/workspace/yodaclaude/gardeners-mate # UK border-planner app (on-device catalogue + Worker/D1)
  app-framework: ~/.openclaw/workspace/yodaclaude/app-framework # cloneable AI feature-app starter (create-app.sh)
  vault: ~/Documents/Openclaw yodabot # the Obsidian second brain itself

